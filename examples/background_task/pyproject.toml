[project]
name = "background-task"
version = "1.0.0"
description = "Demonstrates executing heavy computational loops in a background worker thread without blocking the UI thread."
requires-python = ">=3.11"
authors = [
    { name = "Karcytics SDK Team", role = "Lead Developer" },
]

[tool.karcytics.plugin]
id = "background_task"
min_core_version = "1.2.7"
entry_point = "background_task:initialize"
