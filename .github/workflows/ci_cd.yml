name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write # Required to push to gh-pages branch and create git tags
  id-token: write # Required for PyPI OIDC trusted publishing

jobs:
  test-and-lint:
    name: Execute SDK Verification on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up virtual environment and sync dependencies
        run: |
          uv venv
          uv pip install -e .
          uv pip install pytest pytest-cov pytest-qt ruff mypy types-requests

      - name: Lint and Format Audit (Ruff)
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Static Type Check (Mypy)
        run: |
          uv run mypy src

      - name: Headless Unit Testing with Coverage Gates
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: |
          uv run pytest

  deploy-docs:
    name: Deploy Documentation
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs and Material Theme
        run: |
          pip install mkdocs-material "mkdocstrings[python]"

      - name: Build and Deploy to GitHub Pages
        env:
          PYTHONPATH: src
        run: |
          mkdocs gh-deploy --force

  publish:
    name: Build & Publish SDK
    needs: test-and-lint
    runs-on: ubuntu-latest
    environment:
      name: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract Version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Check if Tag Exists
        id: check_tag
        run: |
          if git rev-parse "v${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "TAG_EXISTS=true" >> $GITHUB_ENV
            echo "Tag v${{ env.VERSION }} already exists. Skipping publish."
          else
            echo "TAG_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Create Git Tag
        if: env.TAG_EXISTS == 'false'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ env.VERSION }}"
          git push origin "v${{ env.VERSION }}"

      - name: Build Package
        if: env.TAG_EXISTS == 'false'
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        if: env.TAG_EXISTS == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Build SDK ZIP Archive
        if: env.TAG_EXISTS == 'false'
        run: |
          ZIP_NAME="biopro_sdk_v${{ env.VERSION }}.zip"
          zip -r "$ZIP_NAME" . \
            --exclude "*.git*" \
            --exclude "*tests/*" \
            --exclude "*__pycache__/*" \
            --exclude "*.venv/*" \
            --exclude "*.DS_Store" \
            --exclude "*.pytest_cache/*" \
            --exclude "*.github/*"

      - name: Create GitHub Release for ZIP
        if: env.TAG_EXISTS == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "BioPro SDK v${{ env.VERSION }}"
          generate_release_notes: true
          files: "biopro_sdk_v${{ env.VERSION }}.zip"

      - name: Calculate SHA256 Hash
        if: env.TAG_EXISTS == 'false'
        id: hash
        run: |
          ZIP_NAME="biopro_sdk_v${{ env.VERSION }}.zip"
          SHA256=$(sha256sum "$ZIP_NAME" | awk '{ print $1 }')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Checkout BioPro-Distribution
        if: env.TAG_EXISTS == 'false'
        uses: actions/checkout@v4
        with:
          repository: KalaimaranB/BioPro-Distribution
          token: ${{ secrets.DIST_PAT }}
          path: dist-repo

      - name: Update registry.json
        if: env.TAG_EXISTS == 'false'
        run: |
          cd dist-repo
          python3 - <<'EOF2'
          import json, sys

          with open("registry.json") as f:
              reg = json.load(f)

          new_version = "${{ env.VERSION }}"
          sha256 = "${{ steps.hash.outputs.sha256 }}"
          tag_name = f"v{new_version}"
          zip_name = f"biopro_sdk_{tag_name}.zip"
          download_url = f"https://github.com/${{ github.repository }}/releases/download/{tag_name}/{zip_name}"

          reg["sdk"] = {
              "version": new_version,
              "download_url": download_url,
              "sha256": sha256
          }

          with open("registry.json", "w") as f:
              json.dump(reg, f, indent=2)
          print(f"Updated sdk in registry.json")
          EOF2

      - name: Open Registry Update PR
        if: env.TAG_EXISTS == 'false'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.DIST_PAT }}
          path: dist-repo
          branch: "auto/update-sdk-v${{ env.VERSION }}"
          title: "chore: bump sdk to v${{ env.VERSION }}"
          commit-message: "chore: bump sdk to ${{ env.VERSION }}"
          body: |
            ## Automated Registry Update

            SDK was released at tag `v${{ env.VERSION }}`.

            This PR updates `registry.json` with the latest version.

            > ⚠️ **Review before merging:** Verify the download URL is correct and the ZIP is valid.
          add-paths: registry.json
